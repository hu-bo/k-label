version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  qdrant-ui:
    image: qdrant/qdrant-ui:latest
    container_name: qdrant-ui
    restart: unless-stopped
    ports:
      - "8002:6334"
    environment:
      - QDRANT__HOST=http://qdrant:6333
    depends_on:
      - qdrant

  server:
    image: node:20-alpine
    container_name: klabel-server
    restart: unless-stopped
    working_dir: /data/app
    volumes:
      - ./server:/data/app
    ports:
      - "7001:7001"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    command: sh -c "npm ci --silent && npm run start"
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
