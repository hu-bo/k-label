version: "3.8"
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: "kkkkkkk"
  klabel:
    image: cleanstart/go:latest
    container_name: klabel
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - ./configs:/data/conf
    environment:
      TZ: Asia/Shanghai
      # 可添加更多环境变量，如数据库连接等
    restart: always
    command: ["./server", "-conf", "/data/conf"]
volumes:
  qdrant_storage: {}
